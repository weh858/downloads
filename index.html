<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MODS WORLD</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #10131d;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 28px 18px;
  text-align: center;
  background: linear-gradient(135deg,#182b50,#51318b);
}

header h1 {
  font-size: 38px;
  margin: 5px;
}

header p { color: #d5d8e8; }

main {
  max-width: 1050px;
  margin: auto;
  padding: 22px;
}

.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #39435b;
  border-radius: 12px;
  background: #202638;
  color: white;
  font-size: 16px;
  margin: 15px 0;
}

.tabs {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 15px 0;
}

.tabs button {
  background: #252d42;
  color: white;
  border: 0;
  padding: 12px 20px;
  border-radius: 10px;
  cursor: pointer;
}

.tabs button.active {
  background: #7553dc;
}

#files {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 16px;
}

.card {
  background: #202638;
  border: 1px solid #303b54;
  padding: 20px;
  border-radius: 15px;
  overflow-wrap: anywhere;
}

.card h3 { margin-top: 5px; }

.card p {
  color: #aab4ca;
  font-size: 13px;
}

.download {
  display: block;
  text-align: center;
  background: #7553dc;
  color: white;
  text-decoration: none;
  padding: 12px;
  border-radius: 9px;
  margin-top: 15px;
}

.download:hover {
  background: #916fff;
}

.status {
  color: #b5c0d5;
  text-align: center;
  padding: 20px;
}

footer {
  text-align: center;
  color: #78839b;
  padding: 30px;
}

@media(max-width:500px) {
  header h1 { font-size: 29px; }
  main { padding: 15px; }
  #files { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <h1>🎮 MODS WORLD</h1>
  <p>Твоя коллекция модов и ресурс-паков</p>
</header>

<main>

<input
  id="search"
  class="search"
  placeholder="🔎 Найти мод или ресурс-пак..."
>

<div class="tabs">
  <button class="active" data-category="all">Все файлы</button>
  <button data-category="mods">📦 Моды</button>
  <button data-category="packs">🎨 Ресурс-паки</button>
</div>

<p id="status" class="status">Загружаем файлы...</p>

<section id="files"></section>

</main>

<footer>
  MODS WORLD © 2026
</footer>

<script>
const USER = "weh858";
const REPO = "downloads";
const BRANCH = "main";

let allFiles = [];
let category = "all";

const allowed =
  /\.(zip|jar|mcpack|mcaddon|mcworld|7z|rar)$/i;

async function loadFiles() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(
      `https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`
    );

    if (!response.ok) {
      throw new Error("GitHub не смог получить список файлов");
    }

    const data = await response.json();

    if (data.truncated) {
      throw new Error("Слишком большой список файлов");
    }

    allFiles = data.tree
      .filter(item =>
        item.type === "blob" &&
        allowed.test(item.path)
      )
      .map(item => {
        const path = item.path.toLowerCase();

        const isPack =
          /resource[-_ ]?packs?|resourcepacks|texture[-_ ]?packs?|textures/.test(path);

        return {
          name: item.path.split("/").pop(),
          path: item.path,
          category: isPack ? "packs" : "mods"
        };
      });

    status.textContent =
      "Найдено файлов: " + allFiles.length;

    render();

  } catch (error) {
    status.textContent =
      "Не удалось загрузить список. Проверь подключение и настройки.";
  }
}

function render() {
  const container = document.getElementById("files");
  const search =
    document.getElementById("search").value.toLowerCase();

  container.innerHTML = "";

  const filtered = allFiles.filter(file =>
    (category === "all" || file.category === category) &&
    file.name.toLowerCase().includes(search)
  );

  filtered.forEach(file => {
    const card = document.createElement("article");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent =
      (file.category === "packs" ? "🎨 " : "📦 ") + file.name;

    const description = document.createElement("p");
    description.textContent =
      file.category === "packs" ? "Ресурс-пак" : "Мод";

    const link = document.createElement("a");

    const encodedPath = file.path
      .split("/")
      .map(encodeURIComponent)
      .join("/");

    link.href =
      `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${encodedPath}`;

    link.className = "download";
    link.download = file.name;
    link.textContent = "⬇ Скачать";

    card.append(title, description, link);
    container.appendChild(card);
  });

  if (!filtered.length) {
    container.textContent = "Ничего не найдено.";
  }
}

document.getElementById("search")
  .addEventListener("input", render);

document.querySelectorAll(".tabs button")
  .forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".tabs button")
        .forEach(b => b.classList.remove("active"));

      button.classList.add("active");
      category = button.dataset.category;
      render();
    });
  });

loadFiles();
</script>

</body>
</html>
